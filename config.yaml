# --- Transcription (faster-whisper) ---
model: large-v3
device: cpu
compute_type: int8
language: auto
beam_size: 5
vad_filter: true
vad_min_silence_ms: 500

# --- Forced alignment (torchaudio MMS) ---
alignment:
  segment_padding_sec: 0.35
  sample_rate: 16000

# --- Subtitle segmentation (SRT) ---
subtitle:
  max_words_per_line: 8
  max_lines: 2
  max_duration: 5.0
  min_duration: 0.8
  max_gap_new_line_sec: 0.6

# --- Validation thresholds ---
validation:
  min_word_duration: 0.02
  max_word_duration: 3.0
  max_gap_flag: 2.0
  low_confidence_threshold: 0.55
